name: Build Android APK

on:
  push:
    branches:
      - main # Triggers when you push code to main branch
  pull_request:
    branches:
      - main # Optional: Triggers when a pull request is created against main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Java Development Kit (JDK 17)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Step 3: Set up Flutter environment
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Step 4: Install Flutter dependencies
      - name: Install Dependencies
        run: flutter pub get

      # Step 5: Build the release APK
      - name: Build APK
        run: flutter build apk --release

      # Step 6: Upload APK so you can download it from GitHub Actions
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk